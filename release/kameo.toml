# Kameo: Elements of Power for the Switch: your options. Every other setting is built into the NRO.
# Delete this file and the game writes it again at the next start.

# Language
# "system" follows the Switch's language, or English if the game has no text for it.
# Or one of: "english", "french", "german", "spanish", "italian", "japanese", "korean", "tradchinese".
language = "system"

# Anti-aliasing
# MSAA on the targets the game multisamples: 4 is the game's own, 2 or 0 lowers it. The game draws its 3D scene with no MSAA.
msaa_level = 4
# SMAA on the 3D image, applied before the HUD is drawn.
banjo_renut_smaa = false

# Resolution
# 3D height follows the GPU load; HUD and menus stay at display resolution.
banjo_renut_dynamic_resolution = true
# Lowest and highest handheld height.
banjo_renut_dynamic_handheld_low = 540
banjo_renut_dynamic_handheld_high = 720
# Lowest and highest docked height.
banjo_renut_dynamic_docked_low = 720
banjo_renut_dynamic_docked_high = 1080
# Heights between low and high; 0 uses only the two ends.
banjo_renut_dynamic_steps = 4
# Resolution drops while the GPU takes longer than this per frame, in milliseconds.
banjo_renut_dynamic_gpu_ms = 34.5
# Seconds with room to spare before the resolution goes back up.
banjo_renut_dynamic_up_s = 1.0
# Handheld and docked 3D height when dynamic resolution is off.
banjo_renut_render_height_handheld = 720
banjo_renut_render_height_docked = 900
# Docked output height for HUD, menus and text.
banjo_renut_display_height_docked = 1080

# Frame rate
# Can be "30", "60" or "Off".
frame_cap = "60"

# Four-core mode
# Through a Sphaira forwarder, the audio worker and the shader compiler run on core 3; 0 leaves core 3 to the system.
banjo_system_core = 1
# Only for a forwarder not made by Sphaira, which is recognised automatically.
banjo_forwarder_program_id = "05D6EA1333487000"

# Logs
# Only crash logs are written; remove the # for a bug report.
# log_level = "info"

# Controls
# Face buttons go by position, as on an Xbox 360 pad; false goes by letter.
input_xbox_layout = true
# Single Joy-Cons held sideways, one per player.
input_joycon_sideways = true

# Button maps: the Switch buttons that press each Xbox button. Empty is the default.
# Buttons: A B X Y L R ZL ZR PLUS MINUS LSTICK RSTICK UP DOWN LEFT RIGHT SL SR NONE. Example: a = "B, ZR"

# Player 1, also used by players 3 and 4.
[input_p1]
a = ""
b = ""
x = ""
y = ""
lb = ""
rb = ""
lt = ""
rt = ""
start = ""
back = ""
ls = ""
rs = ""
up = ""
down = ""
left = ""
right = ""

